# NOTE: search is provided by the standalone SearXNG service in
# services/searchrouter/ (container `searchrouter_aios` on 127.0.0.1:8081,
# started via `make search-up` or its own docker-compose.yml). Do not re-add a
# searchrouter service here: the old build-based definition was removed
# because ../searchrouter has no Dockerfile and conflicts with the running
# SearXNG container's name.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui_aios
    restart: always
    network_mode: host
    environment:
      - PORT=3000
      - HOST=127.0.0.1
      - WEBUI_SECRET_KEY_FILE=/app/backend/data/.webui_secret_key
      - OLLAMA_BASE_URL=
      - OPENAI_API_BASE_URL=http://127.0.0.1:8080/v1
      - OPENAI_API_KEY=not-needed
      - ENABLE_ORJSON=true
      - ENABLE_TOOL_PERMISSIONS=true
      # Cap runaway native tool-call loops (OWUI default is 256 iterations —
      # a confused local model can spin for minutes). 4 covers
      # search→fetch→answer with headroom.
      - CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS=4
      - ENABLE_OLLAMA_API=false
      - ENABLE_IMAGE_GENERATION=false
      - DEFAULT_MODELS=qwen-fast
      - DEFAULT_MODEL_METADATA={"capabilities":{"web_search":true,"knowledge":true,"memory":true,"builtin_tools":true,"code_interpreter":true,"time":true},"default_feature_ids":["knowledge","time","memory"],"builtinTools":{"knowledge":true,"time":true,"code_interpreter":true,"web_search":true}}
      - DEFAULT_MODEL_PARAMS={"function_calling":"native","max_tokens":4096,"temperature":0.7}
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=1000
      - RAG_RELEVANCE_THRESHOLD=0.0
      - ENABLE_CONTEXT_COMPACTION=true
      - CONTEXT_COMPACTION_TOKEN_THRESHOLD=12000
      - CONTEXT_COMPACTION_TOKEN_CAP=5000
      - ENABLE_PERSISTENT_CONFIG=true
      - ENABLE_KB_EXEC=false
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://127.0.0.1:8081/search?q=<query>
      - WEB_SEARCH_RESULT_COUNT=3
      - WEB_SEARCH_CONCURRENT_REQUESTS=2
      - BYPASS_WEB_SEARCH_WEB_LOADER=true
      - ENABLE_MEMORIES=true
      - ENABLE_MEMORY_SYSTEM_CONTEXT=true
      - ENABLE_MEMORY_BACKGROUND_REVIEW=true
      - MEMORIES_REVIEW_INTERVAL_TURNS=10
      - VECTOR_DB=chroma
      - RAG_EMBEDDING_MODEL=BAAI/bge-base-en-v1.5
      - RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE=true
      - WEBUI_AUTH=false
      - ENABLE_SIGNUP=false
      - ENABLE_API_KEYS=false
      - WEBUI_ADMIN_EMAIL=admin@localhost
      - WEBUI_ADMIN_NAME=Admin
    env_file:
      - ${HOME}/.config/aios/open-webui.env
    volumes:
      - open-webui:/app/backend/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8g

volumes:
  open-webui:
