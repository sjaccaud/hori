# Self-hosted SearXNG for Open-WebUI / HORI.
#
# Provides a SearXNG-compatible JSON search endpoint on 127.0.0.1:8081.
# No API keys are required: SearXNG is a metasearch engine that aggregates
# public, no-key search engines (DuckDuckGo, Mojeek, Startpage, Bing,
# Wikipedia, etc.).
#
# For future paid fallbacks (Brave/Tavily/Exa/Jina), put keys in
# ~/.config/aios/searchrouter.env and wire them through the Open-WebUI
# web-search settings or aios_core multi_search.py; SearXNG itself does not
# consume those keys.
#
# Run: docker compose -f services/searchrouter/docker-compose.yml up -d
# Secret: the first time, run `make search-secret` or set SEARXNG_SECRET.

services:
  searchrouter:
    image: searxng/searxng:latest
    container_name: searchrouter_aios
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./data:/var/cache/searxng
    environment:
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_PORT=8080
      - SEARXNG_SECRET=${SEARXNG_SECRET:-aios-local-search-generate-secret}
    env_file:
      - ./.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
