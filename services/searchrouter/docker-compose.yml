# Search router for Open-WebUI / HORI.
#
# This container provides SearXNG-compatible search on 127.0.0.1:8081.
# It uses paid search APIs only when keys are supplied; otherwise it falls
# back to DuckDuckGo / SearXNG. Keys belong in ~/.config/aios/searchrouter.env
# (mode 0600) and are never committed to the repo.
#
# Run: docker compose -f services/searchrouter/docker-compose.yml up -d
services:
  searchrouter:
    image: open-webui-searchrouter:latest
    container_name: searchrouter_aios
    network_mode: host
    restart: always
    # The image's default command hard-codes --host 0.0.0.0, so override it
    # to bind only to localhost and avoid LAN exposure.
    command: uvicorn main:app --host 127.0.0.1 --port 8081
    environment:
      - HOST=127.0.0.1
      - PORT=8081
      - SEARCH_RESULT_COUNT=3
      - MAX_SNIPPET_LENGTH=1500
      - REQUEST_TIMEOUT=10.0
      - SEARCH_MODE=priority
      - SEARCH_DEFAULT_SOURCE=all
      - SEARXNG_FALLBACK_URL=
      # Leave paid keys empty unless you put them in searchrouter.env.
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
    env_file:
      - ${HOME}/.config/aios/searchrouter.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
