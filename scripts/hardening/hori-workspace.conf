# systemd-tmpfiles config: create /tmp/hori-workspace at boot.
#
# /tmp is volatile (wiped on reboot). The tool daemon's systemd unit uses
# ReadWritePaths=/tmp/hori-workspace, which requires the directory to exist
# BEFORE mount namespace setup. ExecStartPre cannot create it because
# namespace setup runs first (status 226/NAMESPACE). This tmpfiles.d entry
# runs early in boot (via sysinit.target) and creates the directory before
# any services start.
#
# Installed to /etc/tmpfiles.d/hori-workspace.conf by install_tool_daemon.sh.
#
# Traces to: docs/operations.md "Safety Spine Incident (Aug 8 2026)".
d /tmp/hori-workspace 1777 aios-worker aios-worker -
